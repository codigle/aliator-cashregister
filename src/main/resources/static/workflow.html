<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow">
<title>店舗運用設定 · Aliator CashRegister</title>
<link rel="stylesheet" href="/assets/console2.css?v=8"><link rel="stylesheet" href="/assets/ops3.css?v=8">
<style>
.workflow-shell{width:min(900px,95vw);margin:32px auto 90px}.workflow-card{background:var(--surface,#fff);border:1px solid #cbd5d1;border-radius:20px;padding:22px;margin:18px 0;box-shadow:0 5px 22px #0000000a}.workflow-card h2{margin:0 0 7px;font-size:1.16rem}.workflow-card p{margin-top:5px;color:#65746e}.workflow-row{display:flex;justify-content:space-between;gap:20px;align-items:center;border-top:1px solid #e5edea;padding:15px 0}.workflow-row:first-of-type{border-top:0}.workflow-row input[type=checkbox]{width:23px;height:23px;flex:0 0 auto;accent-color:#146e50}.workflow-row strong{display:block}.workflow-row small{display:block;max-width:660px;opacity:.78;padding-top:5px}.workflow-select{display:grid;gap:6px;margin-top:14px}.workflow-select select{width:100%;min-height:42px}.workflow-note{background:#ecf7f2;border-left:4px solid #1b8060;padding:14px;border-radius:8px}.workflow-actions{display:flex;align-items:center;gap:18px;flex-wrap:wrap}.workflow-actions button{min-width:160px}.workflow-status{font-weight:600}.workflow-error{color:#b91c1c}@media(max-width:560px){.workflow-card{padding:16px}.workflow-row{gap:10px}}
</style>
<script defer src="/assets/workflow8.js?v=8"></script>
<script defer src="/assets/ui17.js?v=17"></script></head><body>
<header class="header"><a class="brand" href="/portal.html"><span class="logo">A</span><span>cashregister <small id="header-subtitle">Workflow settings</small></span></a><div class="actions"><a href="/portal.html" class="btn outline sm" id="back-link">← Workspace</a><a href="/print.html" class="btn outline sm" id="printer-link">Printer Station</a></div></header>
<main class="workflow-shell"><div class="page-heading"><div><div class="eyebrow">RESTAURANT OPERATIONS</div><h1 id="main-title">運用・自動印刷設定</h1><p id="lead">注文と会計の印刷、配膳完了確認を店舗ごとに設定します。</p></div><label>🌐 <select id="workflow-lang"><option value="ja">日本語</option><option value="en">English</option><option value="zh">简体中文</option><option value="ko">한국어</option><option value="tr">Türkçe</option></select></label></div>
<div class="workflow-note" id="notice">初期設定では自動印刷がOFFです。テスト印刷と用紙の確認後、必要な機能だけ有効にしてください。</div>
<form id="workflow-form">
<section class="workflow-card"><h2 id="kitchen-title">キッチン伝票</h2><p id="kitchen-lead">お客様が注文を確定した時点で、承認操作なしに印刷待ちに追加します。</p><label class="workflow-row"><span><strong id="auto-kitchen-label">新規注文を自動印刷する</strong><small id="auto-kitchen-desc">ゲストの実注文のみ。管理画面のデモ注文は自動印刷しません。</small></span><input id="autoKitchen" type="checkbox"></label><label class="workflow-select"><span id="kitchen-device-label">キッチンプリンター</span><select id="kitchenDeviceId"><option value="">未選択</option></select></label></section>
<section class="workflow-card"><h2 id="delivery-title">調理と提供確認</h2><label class="workflow-row"><span><strong id="delivery-label">手動の配膳完了確認を使用する</strong><small id="delivery-desc">OFFなら「調理完了」で注文は自動的に完了。ONなら「提供済み」操作を表示します。</small></span><input id="confirmDelivery" type="checkbox"></label></section>
<section class="workflow-card"><h2 id="receipt-title">お会計レシート</h2><p id="receipt-lead">会計処理が完了すると、日本語のレシートを自動的に印刷待ちに追加します。</p><label class="workflow-row"><span><strong id="auto-receipt-label">会計後に自動印刷する</strong><small id="auto-receipt-desc">このポートフォリオ版は模擬決済です。税率と適格請求書番号は設定されていません。</small></span><input id="autoReceipt" type="checkbox"></label><label class="workflow-select"><span id="receipt-device-label">レシートプリンター</span><select id="receiptDeviceId"><option value="">未選択</option></select></label></section>
<div class="workflow-actions"><button class="btn primary" type="submit" id="save-btn">設定を保存</button><span class="workflow-status" id="workflow-status" role="status"></span></div>
</form></main></body></html>

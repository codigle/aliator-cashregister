<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>メニュー言語・詳細設定 · CashRegister</title><link rel="stylesheet" href="/assets/console2.css?v=8"><link rel="stylesheet" href="/assets/v9.css?v=9"><script defer src="/assets/menu-settings13.js?v=13"></script><link rel="stylesheet" href="/assets/menu-settings13.css?v=13"><style>.v9-settings{max-width:1050px;margin:auto;padding:20px}.v9-settings .card{margin:18px 0;padding:20px}.v9-settings input[type=checkbox]{height:21px;width:21px}.v9-settings .lang-row{display:flex;flex-wrap:wrap;gap:14px;padding:14px 0}.v9-settings textarea{width:100%;min-height:75px}.v9-settings select,.v9-settings input[type=text],.v9-settings input[type=number]{min-height:40px;padding:9px}.v9-flex{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.v9-editor-group{padding:12px;border:1px solid #ccd2dc;border-radius:12px;margin:10px 0}.v9-editor-option{display:grid;grid-template-columns:1fr 1fr 110px auto;gap:8px;margin:6px 0}.v9-editor-option input{min-width:0;width:100%}@media(max-width:580px){.v9-editor-option{grid-template-columns:1fr 1fr}.v9-settings{padding:8px}}</style><script defer src="/assets/ui17.js?v=17"></script></head><body><header class="header"><a class="brand" href="/portal.html"><span class="logo">A</span><span>CashRegister <small>メニュー・言語設定</small></span></a><div class="actions"><a class="btn outline sm" href="/portal.html">← 店舗管理</a><a class="btn outline sm" href="/workflow.html">印刷設定</a></div></header><main class="v9-settings"><section class="card"><h1>メニュー言語・自動翻訳</h1><p>商品は日本語で登録します。お客様に表示する言語を選ぶと、Codigle APIで翻訳できます。</p><form id="languages"><label>商品登録の言語 <select id="source-lang"><option value="ja">日本語（標準）</option></select></label><div class="lang-row" id="languages-select"><label><input type="checkbox" value="ja"> 日本語</label><label><input type="checkbox" value="en"> English</label><label><input type="checkbox" value="zh"> 中文</label><label><input type="checkbox" value="ko"> 한국어</label><label><input type="checkbox" value="tr"> Türkçe</label></div><label class="v9-flex"><input id="auto-translate" type="checkbox"> 公開メニューをCodigle APIで自動翻訳する</label><p class="tiny muted">APIの認証情報はサーバーで管理します。未翻訳の場合は日本語で表示されます。</p><button class="btn primary" type="submit">言語設定を保存</button><button class="btn outline" type="button" id="refresh-translations">全メニューを再翻訳</button></form><div class="card" style="margin:10px 0;background:#f6f7f9"><b>翻訳の進行状況</b><pre id="translation-status" style="white-space:pre-wrap;overflow-wrap:anywhere">読み込み中…</pre></div></section><section class="card"><h2>商品詳細・選択オプション</h2><p>商品を選び、原材料・アレルゲン・調理説明と選択オプションを編集します。</p><label>商品<select id="product"><option value="">メニューを読み込み中…</option></select></label><div id="product-editor" class="hide"><div class="stack"><label>原材料（参考情報・日本語）<textarea id="ingredients" maxlength="600"></textarea></label><label>アレルゲン（店舗で確認）<textarea id="allergens" maxlength="300"></textarea></label><label>調理説明<textarea id="preparation" maxlength="600"></textarea></label><label>辛さ（0〜5）<input id="spice" type="number" min="0" max="5"></label><button class="btn outline" id="save-details">商品詳細を保存</button></div><h3>選択オプション</h3><div id="option-groups"></div><button class="btn outline" id="new-group">＋ 選択グループを追加</button><button class="btn primary" id="save-options">選択オプションを保存</button><p class="tiny muted">確定済み注文の選択内容は保持されます。注文受付中はオプションを削除しないでください。</p></div></section><div id="toast" class="toast" role="status"></div></main></body></html>
